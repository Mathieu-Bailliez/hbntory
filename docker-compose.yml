services:
  bdd:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
    volumes:
      - bdd_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  external-products-api:
    build: https://github.com/hbtn-edu/hbntory-products-api.git
    environment:
      HBN_PRODUCTS_PORT: "5000"

  backoffice:
    build: ./backoffice
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bdd:5432/${POSTGRES_DB}
      PRODUCT_API_BASE_URL: http://external-products-api:5000
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      - bdd
      - external-products-api

  product-mcp-server:
    build:
      context: ./product_mcp_server
      dockerfile: Dockerfile
    environment:
      PRODUCT_API_BASE_URL: http://external-products-api:5000
    depends_on:
      - external-products-api

volumes:
  bdd_data:
