services:
  bdd:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
    volumes:
      - bdd_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  external-products-api:
    build: https://github.com/hbtn-edu/hbntory-products-api.git
    environment:
      HBN_PRODUCTS_PORT: "5000"
    ports:
      - "5001:5000"

volumes:
  bdd_data:
